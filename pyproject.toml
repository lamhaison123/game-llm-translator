[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-llm-translator"
version = "1.1.6"
description = "LLM-powered translator toolkit for RPG Maker and Unity games"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.39.0",
  "filelock>=3.13",
  "openai>=1.54.0",
  "PySide6>=6.7",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
  "rich>=13.9.0",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "pillow>=10.0",
  "pyright>=1.1.409",
  "pytest>=8",
  "pytest-mock>=3.14",
]

[project.scripts]
game-translator = "game_llm_translator.cli:app"
game-translator-gui = "game_llm_translator.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
exclude = ["dist", "build"]
